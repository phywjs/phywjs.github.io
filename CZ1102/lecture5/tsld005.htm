 <H1>Precedence</H1> 
 <P><UL>
<LI><H2>Operators *, /, and % have higher precedence than +, -.
</H2>
</UL><UL>
<LI><H2>
</H2>
</UL><UL>
<LI><H2>Thus
</H2>
</UL><UL>
<H2>
</H2>
<UL>
5 + 3 * 4   is
<BR><BR>5 + (3 * 4) = 5 + 12 =17
<BR>
<BR>8 % 3 + 5   is
<BR>(8 % 3) + 5 = 2 + 5 = 7
</UL></UL></P>
