 <H1>Assignment Operators Associate from Right to Left</H1> 
 <P><UL>
<LI><H2>The expression 
</H2>
<UL>
	x = y = z
<BR></UL></UL><UL>
<H2>	means
</H2>
<UL>
	x = (y = z)
<BR><BR>
</UL></UL><UL>
<LI><H2>If z is 10, the value 10 will be assigned to y and in turn assigned to x.
</H2>
</UL></P>
