 <H1>The Recursive Factorial Function</H1> 
 <P><UL>
<H2>
</H2>
<BR></UL><UL>
<H2>
</H2>
</UL><UL>
<H2>int fact(int n)
</H2>
</UL><UL>
<H2>{
</H2>
</UL><UL>
<H2>   if (n &#060= 1)
</H2>
</UL><UL>
<H2>     return 1;
</H2>
</UL><UL>
<H2>   else
</H2>
</UL><UL>
<H2>     return n*fact(n-1);
</H2>
</UL><UL>
<H2>}
</H2>
</UL></P>
<P>This is the program <a href="pg197.c">pg197.c</a></P>
