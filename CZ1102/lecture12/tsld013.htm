 <H1>A Non-recursive Factorial Function</H1> 
 <P><UL>
<H2>
</H2>
<BR></UL><UL>
<H2>
</H2>
</UL><UL>
<H2>int fact(int n)
</H2>
</UL><UL>
<H2>{
</H2>
</UL><UL>
<H2>   int k, prod;
</H2>
</UL><UL>
<H2>    
</H2>
</UL><UL>
<H2>   prod = 1;
</H2>
</UL><UL>
<H2>   for(k=1; k&#060=n; ++k){ 
</H2>
</UL><UL>
<H2>      prod = prod * k;
</H2>
</UL><UL>
<H2>   }
</H2>
</UL><UL>
<H2>   return prod; 
</H2>
</UL><UL>
<H2>}
</H2>
</UL></P>
