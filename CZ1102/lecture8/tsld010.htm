 <H1>goto example</H1> 
 <P><UL>
<H2>for(i=0; i&#0605; i++)
</H2>
<BR></UL><UL>
<H2>   for(j=0; j&#0605; j++)
</H2>
</UL><UL>
<H2>      for(k=0; k&#0605; k++)
</H2>
</UL><UL>
<H2>         if(i+j+k == 2)
</H2>
</UL><UL>
<H2>            goto out;
</H2>
</UL><UL>
<H2>out:
</H2>
</UL><UL>
<H2>printf("i=%d,j=%d,k=%d\n",
</H2>
</UL><UL>
<H2>        i, j, k);
</H2>
</UL><UL>
<H2>
</H2>
</UL><UL>
<H2>The output is
</H2>
</UL><UL>
<H2>
</H2>
</UL><UL>
<H2>i=0, j=0, k=2</H2>
</UL></P>
