 <H1>For Loop Example</H1> 
 <P><UL>
<H2>sum = 0;
</H2>
<BR></UL><UL>
<H2>for(i = 1; i &#060= 4; i += 1){
</H2>
</UL><UL>
<H2>   sum += i;
</H2>
</UL><UL>
<H2>   printf("i=%d, sum=%d\n",
</H2>
</UL><UL>
<H2>           i, sum);
</H2>
</UL><UL>
<H2>}
</H2>
</UL><UL>
<H2>
</H2>
</UL><UL>
<H2>prints
</H2>
</UL><UL>
<H2>
</H2>
</UL><UL>
<H2>i=1, sum=1
</H2>
</UL><UL>
<H2>i=2, sum=3
</H2>
</UL><UL>
<H2>i=3, sum=6
</H2>
</UL><UL>
<H2>i=4, sum=10</H2>
</UL></P>
